name: Monitor do Guará

on:
  schedule:
    # A cada 15 minutos. O GitHub pode atrasar alguns minutos em horário de pico.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write

env:
  SITE: https://168-138-141-214.sslip.io

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pingar o site
        id: ping
        run: |
          # Três tentativas antes de declarar queda: evita alarme por soluço de rede.
          for tentativa in 1 2 3; do
            CODIGO=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$SITE" || echo 000)
            echo "tentativa $tentativa -> HTTP $CODIGO"
            if [ "$CODIGO" = "200" ]; then
              echo "status=no-ar" >> "$GITHUB_OUTPUT"
              echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "status=fora" >> "$GITHUB_OUTPUT"
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

      # O ping acima só prova que o servidor respondeu. Em 27/08/2026 o painel
      # ficou mais de um dia quebrado devolvendo 200 o tempo todo: o servidor
      # entregava a página e ela morria dentro do navegador, num erro de React.
      # Nenhuma checagem de HTTP pega isso — só abrindo um navegador de verdade.
      #
      # Roda aqui, e não na VM, porque ela tem pouca memória e um navegador não
      # caberia. Repositório público tem minutos de Actions ilimitados.
      - name: Abrir o painel num navegador de verdade
        if: steps.ping.outputs.status == 'no-ar'
        id: navegador
        continue-on-error: true
        run: |
          npm init -y > /dev/null
          npm i -D playwright@latest > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node verificar-painel.mjs

      # Servidor de pé, painel quebrado — o caso que passou despercebido por
      # mais de um dia: HTTP 200 na mão e tela de erro no navegador.
      - name: Abrir alerta se o painel quebrou
        if: steps.navegador.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const abertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'guara-painel-quebrado',
            });
            if (abertos.data.length > 0) {
              core.info('Ja existe alerta aberto: #' + abertos.data[0].number);
              return;
            }
            const agora = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            const corrida = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Guara: o servidor responde, mas o painel nao abre',
              labels: ['guara-painel-quebrado'],
              body: [
                'O site respondeu HTTP 200, mas ao abrir num navegador de verdade o painel',
                'nao montou. Quem acessar vai ver tela de erro ou pagina em branco.',
                '',
                '- **Quando:** ' + agora + ' (Brasilia)',
                '- **O erro exato:** [ver o log da verificacao](' + corrida + ')',
                '',
                '### Isso nao e a VM caida',
                'O servidor esta de pe e entregando a pagina. O problema esta no codigo',
                'do painel — normalmente um erro de JavaScript que derruba o app ao montar.',
                '',
                '### Por onde comecar',
                '1. Abra o log da verificacao acima: ele traz o erro do navegador',
                '2. Se for erro de React, confira hooks chamados depois de um `return`',
                '3. Para voltar ao ar rapido, publique a versao anterior: troque a tag',
                '   `:latest` pelo SHA do commit bom em `deploy/docker-compose.yml`',
                '',
                'Este alerta fecha sozinho quando o painel voltar a abrir.',
              ].join('\n'),
            });

      - name: Abrir alerta se caiu
        if: steps.ping.outputs.status == 'fora'
        uses: actions/github-script@v8
        with:
          script: |
            const codigo = '${{ steps.ping.outputs.codigo }}';

            // Não abre um alerta novo se já existe um aberto — senão vira spam.
            const abertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'guara-fora-do-ar',
            });
            if (abertos.data.length > 0) {
              core.info('Já existe alerta aberto: #' + abertos.data[0].number);
              return;
            }

            const agora = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Guará fora do ar (HTTP ${codigo})`,
              labels: ['guara-fora-do-ar'],
              body: [
                `O site não respondeu em 3 tentativas seguidas.`,
                ``,
                `- **Quando:** ${agora} (Brasília)`,
                `- **Resposta:** HTTP ${codigo}`,
                `- **Site:** ${process.env.SITE}`,
                ``,
                `### O que provavelmente aconteceu`,
                `A causa mais provável é a Oracle ter parado a VM por ociosidade.`,
                `Ela é **parada**, não destruída — os dados estão intactos.`,
                ``,
                `### Como religar`,
                `1. Entre em https://cloud.oracle.com`,
                `2. Compute → Instances → selecione a instância`,
                `3. Clique em **Start**`,
                `4. Aguarde uns 2 minutos; os containers sobem sozinhos (\`restart: always\`)`,
                ``,
                `Quando voltar, este alerta fecha sozinho na próxima verificação.`,
              ].join('\n'),
            });

      - name: Fechar alerta se voltou
        # Só fecha o alerta de painel quebrado se o navegador também aprovou.
        # O site responder já basta para o alerta de "fora do ar", mas não
        # prova que o painel abre — foi essa distinção que faltou no incidente.
        if: steps.ping.outputs.status == 'no-ar'
        uses: actions/github-script@v8
        env:
          PAINEL_OK: ${{ steps.navegador.outcome == 'success' }}
        with:
          script: |
            const rotulos = process.env.PAINEL_OK === 'true'
              ? ['guara-fora-do-ar', 'guara-painel-quebrado']
              : ['guara-fora-do-ar'];
            const encontrados = [];
            for (const label of rotulos) {
              const r = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: label,
              });
              encontrados.push(...r.data);
            }
            const abertos = { data: encontrados };
            const agora = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            for (const issue of abertos.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Voltou ao ar em ${agora} (Brasília).`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Registrar batimento semanal
        # O GitHub desativa agendamento em repositório sem commit há 60 dias — e aí o
        # monitor morreria em silêncio, que é exatamente o que queremos evitar.
        # Um commit por semana mantém o agendamento vivo pra sempre.
        if: steps.ping.outputs.status == 'no-ar'
        run: |
          ULTIMO=$(git log -1 --format=%ct -- ultima-verificacao.txt 2>/dev/null || echo 0)
          AGORA=$(date +%s)
          if [ $((AGORA - ULTIMO)) -lt 604800 ]; then
            echo "batimento recente, nada a fazer"
            exit 0
          fi
          date -u '+%Y-%m-%d %H:%M UTC — site respondendo normalmente' > ultima-verificacao.txt
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ultima-verificacao.txt
          git commit -m 'batimento semanal do monitor'
          git push
